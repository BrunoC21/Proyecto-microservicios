version: '3.8'

services:
  db:
    image: postgres:13
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: microservicios
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  estudiante:
    build: ./estudiante
    container_name: estudiante
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://user:secret@db:5432/microservicios
    depends_on:
      - db
    restart: on-failure

  evaluacion:
    build: ./evaluacion
    container_name: evaluacion
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://user:secret@db:5432/microservicios
    depends_on:
      - db
      - estudiante
    restart: on-failure

volumes:
  postgres-data:

